<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions — Manuel Katz / Suono e Silenzio</title>
  <meta name="description" content="Browse all guided meditation sessions and dharma talks by Manuel Katz. Filter by subject or search for a topic." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/main.css" />
</head>
<body data-page="sessions.html">

  <div id="nav-mount"></div>

  <!-- Page Hero -->
  <header class="page-hero">
    <div class="container">
      <h1 data-i18n="page_sessions_title">Meditation Sessions</h1>
      <p data-i18n="page_sessions_subtitle">All recorded teachings, freely offered.</p>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       STICKY CONTROLS
  ════════════════════════════════════════════ -->
  <div class="sessions-controls" role="search" aria-label="Filter sessions">
    <div class="container">
      <div class="controls-inner">

        <!-- Search -->
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input
            type="search"
            id="session-search"
            class="search-input"
            data-i18n-placeholder="sessions_search_placeholder"
            placeholder="Search topics, titles…"
            autocomplete="off"
            aria-label="Search sessions"
          />
        </div>

        <!-- Filter buttons -->
        <div class="filter-btns" role="group" aria-label="Filter by subject">
          <button class="filter-btn active" data-filter="all"               data-i18n="filter_all">All</button>
          <button class="filter-btn"        data-filter="meditation-basics" data-i18n="filter_basics">Meditation Basics</button>
          <button class="filter-btn"        data-filter="mind-thoughts"     data-i18n="filter_mind">Mind &amp; Thoughts</button>
          <button class="filter-btn"        data-filter="buddhist-concepts" data-i18n="filter_buddhist">Buddhist Concepts</button>
          <button class="filter-btn"        data-filter="resilience"        data-i18n="filter_resilience">Resilience</button>
          <button class="filter-btn"        data-filter="body-breath"       data-i18n="filter_body">Body &amp; Breath</button>
        </div>

        <!-- Count -->
        <span id="sessions-count" class="sessions-count" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SESSIONS GRID
  ════════════════════════════════════════════ -->
  <main>
    <div class="container">
      <div id="sessions-grid" class="sessions-full-grid" aria-label="Sessions list">
        <!-- Populated by sessions.js -->
        <p style="grid-column:1/-1;text-align:center;padding:4rem;color:#9ca3af;">Loading…</p>
      </div>

      <!-- Full playlist link -->
      <div class="text-center" style="padding-bottom:4rem;">
        <p style="color:#6b7280;margin-bottom:1rem;font-size:.9rem;">
          ▶ All sessions are from the public YouTube playlist "מדיטציה לכולם" (Meditation for Everyone)
        </p>
        <a href="https://www.youtube.com/playlist?list=PLBnExi1jlBdj2QnlLQ144sdKYSi3bfFYK"
           target="_blank" rel="noopener"
           class="btn btn-outline">
          Open Full Playlist on YouTube →
        </a>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="data/sessions-data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sessions.js"></script>
</body>
</html>
